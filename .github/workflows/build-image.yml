name: Build & Push OpenWebUI Image

on:
  push:
    branches:
      - Test
      - Arseny_test
      - main
    paths:
      - 'Dockerfile.openwebui'
      - 'themes/**'
      - 'open-webui/**'
      - '.github/workflows/build-image.yml'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}/open-webui
  DOCKERHUB_IMAGE: lordetsky/mts-ai-workspace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # tag with branch name (e.g. test, arseny-test, main)
            type=ref,event=branch
            # tag "latest" only for Test branch (main deployment branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Test' }}
            # tag with short commit SHA
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.openwebui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
