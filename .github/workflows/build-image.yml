name: Build & Push OpenWebUI Image

on:
  push:
    branches:
      - Test
      - Arseny_test
      - main
    paths:
      - 'Dockerfile.openwebui'
      - 'themes/**'
      - 'open-webui/**'
      - '.github/workflows/build-image.yml'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}/open-webui
  DOCKERHUB_IMAGE: lordetsky/mts-ai-workspace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase branch name
        id: branch
        run: echo "name=$(echo ${GITHUB_REF_NAME} | tr '[:upper:]' '[:lower:]' | tr '_' '-')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build and push to GHCR (Buildx works fine with GHCR)
      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.openwebui
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.branch.outputs.name }}
            ${{ github.ref == 'refs/heads/Test' && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Copy from GHCR to Docker Hub using crane (avoids Buildx push issues)
      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz | tar xz crane
          chmod +x crane

      - name: Copy image to Docker Hub
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          echo "[*] Copying ${{ env.GHCR_IMAGE }}:${BRANCH} -> ${{ env.DOCKERHUB_IMAGE }}:${BRANCH}"
          ./crane copy "${{ env.GHCR_IMAGE }}:${BRANCH}" "${{ env.DOCKERHUB_IMAGE }}:${BRANCH}"

          if [ "${{ github.ref }}" = "refs/heads/Test" ]; then
            echo "[*] Copying -> ${{ env.DOCKERHUB_IMAGE }}:latest"
            ./crane copy "${{ env.GHCR_IMAGE }}:${BRANCH}" "${{ env.DOCKERHUB_IMAGE }}:latest"
          fi

          echo "[*] Done! Image available on both GHCR and Docker Hub."
