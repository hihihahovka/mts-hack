<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voice Chat — MTS AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --text: #e5e5e5;
            --text-dim: #737373;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Background particles ── */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── Close button ── */
        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .close-btn svg { width: 20px; height: 20px; }

        /* ── Main layout ── */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            height: 100%;
        }

        /* ── User transcript ── */
        .user-transcript {
            flex: 0 0 auto;
            text-align: center;
            font-size: 14px;
            color: var(--text-dim);
            min-height: 40px;
            max-width: 90%;
            line-height: 1.5;
            margin-top: auto;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.4s ease;
        }
        .user-transcript.visible { opacity: 1; transform: translateY(0); }

        /* ── Orb ── */
        .orb-container {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            transition: transform 0.15s ease-out, box-shadow 0.5s ease;
        }

        .orb-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: background 0.8s ease;
        }

        /* Idle / ready state */
        .orb-inner {
            background: radial-gradient(circle at 35% 35%,
                rgba(180, 180, 200, 0.4),
                rgba(100, 100, 130, 0.2),
                rgba(40, 40, 60, 0.1)
            );
            box-shadow:
                0 0 40px rgba(150, 150, 180, 0.1),
                inset 0 0 40px rgba(150, 150, 180, 0.05);
        }

        /* Glow ring */
        .orb-glow {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
        }

        /* ── State: Listening ── */
        .state-listening .orb-inner {
            background: radial-gradient(circle at 35% 35%,
                rgba(59, 130, 246, 0.6),
                rgba(37, 99, 235, 0.3),
                rgba(29, 78, 216, 0.15)
            );
            box-shadow:
                0 0 60px rgba(59, 130, 246, 0.2),
                inset 0 0 40px rgba(59, 130, 246, 0.1);
        }
        .state-listening .orb-glow {
            opacity: 1;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        .state-listening .orb {
            animation: breathe 3s ease-in-out infinite;
        }

        /* ── State: Thinking ── */
        .state-thinking .orb-inner {
            background: radial-gradient(circle at 50% 50%,
                rgba(139, 92, 246, 0.6),
                rgba(109, 40, 217, 0.3),
                rgba(91, 33, 182, 0.15)
            );
            box-shadow:
                0 0 60px rgba(139, 92, 246, 0.25),
                inset 0 0 40px rgba(139, 92, 246, 0.1);
            animation: think-shift 2s ease-in-out infinite;
        }
        .state-thinking .orb-glow {
            opacity: 1;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2), transparent 70%);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        /* ── State: Speaking ── */
        .state-speaking .orb-inner {
            background: radial-gradient(circle at 40% 40%,
                rgba(16, 185, 129, 0.6),
                rgba(5, 150, 105, 0.3),
                rgba(4, 120, 87, 0.15)
            );
            box-shadow:
                0 0 60px rgba(16, 185, 129, 0.25),
                inset 0 0 40px rgba(16, 185, 129, 0.1);
        }
        .state-speaking .orb-glow {
            opacity: 1;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2), transparent 70%);
            animation: pulse-glow 1s ease-in-out infinite;
        }

        /* ── State: Error ── */
        .state-error .orb-inner {
            background: radial-gradient(circle at 50% 50%,
                rgba(239, 68, 68, 0.5),
                rgba(185, 28, 28, 0.25)
            );
        }

        /* ── Animations ── */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        @keyframes think-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ── Status text ── */
        .status-text {
            flex: 0 0 auto;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: 0.01em;
            transition: color 0.5s, opacity 0.3s;
            min-height: 24px;
        }
        .state-listening .status-text { color: var(--accent-blue); }
        .state-thinking .status-text { color: var(--accent-purple); }
        .state-speaking .status-text { color: var(--accent-green); }

        /* Thinking dots animation */
        .thinking-dots span {
            animation: dot-bounce 1.4s ease-in-out infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* ── Assistant text ── */
        .assistant-text {
            flex: 0 0 auto;
            text-align: center;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            max-width: 90%;
            line-height: 1.6;
            min-height: 60px;
            margin-bottom: auto;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.4s ease;
        }
        .assistant-text.visible { opacity: 1; transform: translateY(0); }

        /* ── Bottom controls ── */
        .controls {
            position: fixed;
            bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }

        .tap-hint {
            font-size: 13px;
            color: var(--text-dim);
            transition: opacity 0.3s;
        }

        /* ── Permission overlay ── */
        .permission-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .permission-overlay h2 {
            font-size: 22px;
            font-weight: 500;
        }
        .permission-overlay p {
            color: var(--text-dim);
            font-size: 15px;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }
        .start-btn {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .start-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(59, 130, 246, 0.3);
        }
        .start-btn:active { transform: scale(0.98); }

        /* ── Connection indicator ── */
        .conn-indicator {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            transition: background 0.3s;
        }
        .conn-dot.disconnected { background: var(--accent-red); }
        .conn-dot.connecting {
            background: var(--accent-purple);
            animation: pulse-glow 1s infinite;
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="bg-particles" id="particles"></div>

    <!-- Connection indicator -->
    <div class="conn-indicator">
        <div class="conn-dot" id="connDot"></div>
        <span id="connLabel">Подключение...</span>
    </div>

    <!-- Close button -->
    <button class="close-btn" id="closeBtn" title="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
    </button>

    <!-- Permission overlay (shown first) -->
    <div class="permission-overlay" id="permOverlay">
        <h2>🎙️ Голосовой ассистент</h2>
        <p>Нажмите чтобы начать разговор. Потребуется доступ к микрофону.</p>
        <button class="start-btn" id="startBtn">Начать разговор</button>
    </div>

    <!-- Main content -->
    <div class="container state-listening" id="mainContainer" style="display:none">
        <div class="user-transcript" id="userTranscript"></div>

        <div class="orb-container" id="orbContainer">
            <div class="orb" id="orb">
                <div class="orb-glow"></div>
                <div class="orb-inner"></div>
            </div>
        </div>

        <div class="status-text" id="statusText">Слушаю...</div>

        <div class="assistant-text" id="assistantText"></div>
    </div>

    <div class="controls" id="controls" style="display:none">
        <span class="tap-hint" id="tapHint">Нажмите на сферу чтобы прервать</span>
    </div>

    <audio id="audioPlayer" style="display:none"></audio>

    <script>
    (() => {
        // ── Config ──
        const WS_URL = (() => {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            // If embedded in iframe, use parent's hostname
            const host = location.hostname || 'localhost';
            const port = location.port || '9001';
            return `${proto}//${host}:${port}/ws/voice`;
        })();

        // ── DOM Elements ──
        const permOverlay = document.getElementById('permOverlay');
        const startBtn = document.getElementById('startBtn');
        const mainContainer = document.getElementById('mainContainer');
        const controls = document.getElementById('controls');
        const orb = document.getElementById('orb');
        const orbContainer = document.getElementById('orbContainer');
        const statusText = document.getElementById('statusText');
        const userTranscript = document.getElementById('userTranscript');
        const assistantText = document.getElementById('assistantText');
        const closeBtn = document.getElementById('closeBtn');
        const connDot = document.getElementById('connDot');
        const connLabel = document.getElementById('connLabel');
        const tapHint = document.getElementById('tapHint');

        // ── State ──
        let ws = null;
        let audioContext = null;
        let audioStream = null;
        let workletNode = null;
        let isRunning = false;
        let currentState = 'listening';
        let audioQueue = [];
        let isPlayingAudio = false;
        let wakeLock = null;

        // ── Background particles ──
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.width = (1 + Math.random() * 2) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        }
        createParticles();

        // ── State management ──
        function setState(state) {
            currentState = state;
            mainContainer.className = 'container state-' + state;

            switch (state) {
                case 'listening':
                    statusText.innerHTML = 'Слушаю...';
                    tapHint.textContent = '';
                    break;
                case 'thinking':
                    statusText.innerHTML = 'Думаю<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>';
                    tapHint.textContent = '';
                    // Clear assistant text
                    assistantText.textContent = '';
                    assistantText.classList.remove('visible');
                    break;
                case 'speaking':
                    statusText.innerHTML = 'Отвечаю';
                    tapHint.textContent = 'Нажмите на сферу чтобы прервать';
                    break;
                case 'error':
                    statusText.innerHTML = 'Ошибка подключения';
                    break;
            }
        }

        // ── WebSocket ──
        function connectWS() {
            connDot.className = 'conn-dot connecting';
            connLabel.textContent = 'Подключение...';

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                connDot.className = 'conn-dot';
                connLabel.textContent = 'Подключено';
                console.log('[VoiceChat] WebSocket connected');
            };

            ws.onclose = () => {
                connDot.className = 'conn-dot disconnected';
                connLabel.textContent = 'Отключено';
                console.log('[VoiceChat] WebSocket disconnected');
                // Reconnect after delay
                if (isRunning) {
                    setTimeout(connectWS, 2000);
                }
            };

            ws.onerror = (err) => {
                console.error('[VoiceChat] WebSocket error:', err);
                setState('error');
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleServerEvent(msg);
                } catch (e) {
                    console.error('[VoiceChat] Parse error:', e);
                }
            };
        }

        function handleServerEvent(msg) {
            switch (msg.type) {
                case 'status':
                    setState(msg.state);
                    break;

                case 'transcript':
                    userTranscript.textContent = msg.text;
                    userTranscript.classList.add('visible');
                    setTimeout(() => {
                        if (currentState !== 'listening') {
                            userTranscript.classList.remove('visible');
                        }
                    }, 5000);
                    break;

                case 'assistant_text':
                    if (msg.text) {
                        assistantText.textContent = msg.text;
                        assistantText.classList.add('visible');
                    }
                    if (msg.done) {
                        setTimeout(() => {
                            assistantText.classList.remove('visible');
                        }, 3000);
                    }
                    break;

                case 'assistant_audio':
                    if (msg.audio) {
                        audioQueue.push(msg.audio);
                        playNextAudio();
                    }
                    break;

                case 'stop_audio':
                    // Server says: stop all audio immediately (user interrupted)
                    stopAllAudio();
                    break;

                case 'rms':
                    updateOrbScale(msg.level);
                    break;

                case 'error':
                    console.error('[VoiceChat] Server error:', msg.message);
                    break;
            }
        }

        // ── Audio playback queue ──
        async function playNextAudio() {
            if (isPlayingAudio || audioQueue.length === 0) return;
            isPlayingAudio = true;

            while (audioQueue.length > 0) {
                const audioB64 = audioQueue.shift();
                try {
                    await playAudioChunk(audioB64);
                } catch (e) {
                    console.error('[VoiceChat] Audio playback error:', e);
                }
            }

            isPlayingAudio = false;
        }

        let currentAudioEl = null;  // Track currently playing audio element

        function playAudioChunk(base64Audio) {
            return new Promise((resolve, reject) => {
                try {
                    const binary = atob(base64Audio);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }

                    const blob = new Blob([bytes], { type: 'audio/mpeg' });
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    currentAudioEl = audio;

                    audio.onended = () => {
                        currentAudioEl = null;
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    audio.onerror = (e) => {
                        currentAudioEl = null;
                        URL.revokeObjectURL(url);
                        reject(e);
                    };

                    audio.play().catch(reject);
                } catch (e) {
                    reject(e);
                }
            });
        }

        function stopAllAudio() {
            audioQueue = [];
            isPlayingAudio = false;
            // Stop currently playing audio element immediately
            if (currentAudioEl) {
                currentAudioEl.pause();
                currentAudioEl.currentTime = 0;
                currentAudioEl = null;
            }
        }

        // ── Orb visualization ──
        let orbScaleTarget = 1;
        let orbScaleCurrent = 1;

        function updateOrbScale(rms) {
            // Map RMS (0-0.1 typical) to scale (1.0 - 1.3)
            orbScaleTarget = 1 + Math.min(rms * 8, 0.3);
        }

        function animateOrb() {
            orbScaleCurrent += (orbScaleTarget - orbScaleCurrent) * 0.15;
            if (currentState === 'listening' || currentState === 'speaking') {
                orb.style.transform = `scale(${orbScaleCurrent})`;
            }
            requestAnimationFrame(animateOrb);
        }
        animateOrb();

        // ── Audio capture ──
        async function startAudioCapture() {
            audioStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                }
            });

            audioContext = new AudioContext({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(audioStream);

            // Create AudioWorklet for raw PCM capture
            const processorCode = `
                class VoiceChatProcessor extends AudioWorkletProcessor {
                    constructor() {
                        super();
                        this.buffer = [];
                        this.bufferSize = 4000; // ~250ms at 16kHz
                    }
                    process(inputs) {
                        const input = inputs[0][0];
                        if (input) {
                            for (let i = 0; i < input.length; i++) {
                                this.buffer.push(input[i]);
                            }
                            if (this.buffer.length >= this.bufferSize) {
                                this.port.postMessage(new Float32Array(this.buffer));
                                this.buffer = [];
                            }
                        }
                        return true;
                    }
                }
                registerProcessor('voice-chat-processor', VoiceChatProcessor);
            `;

            const blob = new Blob([processorCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);

            try {
                await audioContext.audioWorklet.addModule(url);
            } catch (e) {
                // Fallback: some browsers don't support blob URLs for worklets
                console.warn('[VoiceChat] AudioWorklet blob failed, trying ScriptProcessor fallback');
                startScriptProcessorCapture(source);
                return;
            }

            workletNode = new AudioWorkletNode(audioContext, 'voice-chat-processor');
            workletNode.port.onmessage = (event) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const float32 = event.data;
                    const int16 = float32ToInt16(float32);
                    const base64 = arrayBufferToBase64(int16.buffer);
                    ws.send(JSON.stringify({ type: 'audio_chunk', data: base64 }));
                }
            };

            source.connect(workletNode);
            workletNode.connect(audioContext.destination); // needed to keep node alive
        }

        // Fallback for browsers that don't support AudioWorklet with blob URLs
        function startScriptProcessorCapture(source) {
            const bufferSize = 4096;
            const processor = audioContext.createScriptProcessor(bufferSize, 1, 1);

            processor.onaudioprocess = (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const float32 = e.inputBuffer.getChannelData(0);
                    const int16 = float32ToInt16(float32);
                    const base64 = arrayBufferToBase64(int16.buffer);
                    ws.send(JSON.stringify({ type: 'audio_chunk', data: base64 }));
                }
            };

            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        function float32ToInt16(float32Array) {
            const int16 = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                const s = Math.max(-1, Math.min(1, float32Array[i]));
                int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return int16;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ── Wake Lock ──
        async function acquireWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {
                    console.warn('[VoiceChat] Wake lock failed:', e);
                }
            }
        }

        // ── Interrupt on orb click ──
        orbContainer.addEventListener('click', () => {
            if (currentState === 'speaking' || currentState === 'thinking') {
                stopAllAudio();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'interrupt' }));
                }
            }
        });

        // ── Close ──
        closeBtn.addEventListener('click', () => {
            cleanup();
            // If in iframe, notify parent
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'voice-chat-close' }, '*');
            } else {
                window.close();
            }
        });

        function cleanup() {
            isRunning = false;
            if (ws) { ws.close(); ws = null; }
            if (audioStream) {
                audioStream.getTracks().forEach(t => t.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
            stopAllAudio();
        }

        // ── Start ──
        startBtn.addEventListener('click', async () => {
            try {
                isRunning = true;

                // Start audio capture
                await startAudioCapture();
                await acquireWakeLock();

                // Connect WebSocket
                connectWS();

                // Show main UI
                permOverlay.style.display = 'none';
                mainContainer.style.display = 'flex';
                controls.style.display = 'flex';

                setState('listening');
            } catch (err) {
                console.error('[VoiceChat] Start error:', err);
                alert('Не удалось получить доступ к микрофону. Проверьте разрешения.');
            }
        });

        // ── Listen for close from parent (if in iframe) ──
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'voice-chat-close') {
                cleanup();
            }
        });

        // ── Cleanup on page unload ──
        window.addEventListener('beforeunload', cleanup);
    })();
    </script>
</body>
</html>
