services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mts-ai-workspace-test
    ports:
      - "8081:8080"
    environment:
      - OPENAI_API_BASE_URL=https://api.gpt.mws.ru/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama-shared:11434
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=bge-m3
      - ENABLE_RAG_WEB_SEARCH=true
      - SEARXNG_QUERY_URL=http://searxng-shared:8080/search?q=<query>&format=json
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://whisper-shared:9000/v1
      - AUDIO_STT_OPENAI_API_KEY=dummy
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # ВАЖНО: здесь теперь postgres-test (имя сервиса ниже)
      - DATABASE_URL=postgresql://openwebui:openwebui_secret@postgres-test:5432/openwebui
    volumes:
      - open-webui-data-test:/app/backend/data
    networks:
      - mts-shared-net
    depends_on:
      postgres-test: # Тоже меняем здесь
        condition: service_healthy
    restart: unless-stopped

  # МЕНЯЕМ ИМЯ СЕРВИСА С "postgres" на "postgres-test"
  postgres-test: 
    image: postgres:16-alpine
    container_name: postgres-test
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=openwebui_secret
      - POSTGRES_DB=openwebui
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - mts-shared-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    container_name: seed-test
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
    networks:
      - mts-shared-net
    depends_on:
      - open-webui
    restart: "no"

networks:
  mts-shared-net:
    external: true

volumes:
  open-webui-data-test:
  postgres-data-test:
