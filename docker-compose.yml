services:
  # ============================================================
  # OpenWebUI — Main Chat Interface
  # ============================================================
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
    container_name: mts-ai-workspace-${ENV_NAME:-local}
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - OPENAI_API_BASE_URL=https://api.gpt.mws.ru/v1
      - OPENAI_API_KEY=${MWS_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_EMBEDDING_OPENAI_BATCH_SIZE=32
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://whisper-api:9000/v1
      - AUDIO_STT_OPENAI_API_KEY=dummy
      - AUDIO_STT_MODEL=whisper-1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-supersecretkey123}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - ENABLE_SIGNUP=true
      - DATABASE_URL=postgresql://openwebui:openwebui_secret@postgres:5432/openwebui
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
      whisper-api:
        condition: service_started
    networks:
      - mts-net
    restart: unless-stopped

  # ============================================================
  # PostgreSQL — Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-${ENV_NAME:-local}
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=openwebui_secret
      - POSTGRES_DB=openwebui
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432" # Сделали порт переменной!
    networks:
      - mts-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Ollama
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-${ENV_NAME:-local}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mts-net
    restart: unless-stopped

  # ============================================================
  # SearXNG
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-${ENV_NAME:-local}
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    networks:
      - mts-net
    restart: unless-stopped

  # ============================================================
  # Whisper API
  # ============================================================
  whisper-api:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    container_name: whisper-api-${ENV_NAME:-local}
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    networks:
      - mts-net
    restart: unless-stopped

  # ============================================================
  # Seed Service
  # ============================================================
  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    container_name: seed-${ENV_NAME:-local}
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
    depends_on:
      open-webui:
        condition: service_started
    networks:
      - mts-net
    restart: "no"

networks:
  mts-net:
    driver: bridge

volumes:
  open-webui-data:
  ollama-data:
  postgres-data: